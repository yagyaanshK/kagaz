[workspace]
resolver = "2"
members = ["crates/kagaz-core", "crates/kagaz-cli", "apps/desktop"]
# The desktop app needs system libraries (webkit2gtk, gtk); plain `cargo build`
# and `cargo test` stay on the core and the CLI.
default-members = ["crates/kagaz-core", "crates/kagaz-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-KGZ-1.2.0"
repository = "https://github.com/yagyaanshK/kagaz"
authors = ["Yagyaansh Khaneja"]

[profile.dev]
# Line numbers in panics and backtraces, but no full debug info: with builds
# for Linux, Windows and two Android targets, debug output had grown to tens
# of GB.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
# Libraries optimised even in a debug build: opening and shrinking a 1200
# dpi scan (the image library) took many seconds unoptimised.
opt-level = 2

# The core's own image work (putting an ID page together, tidying it) too.
[profile.dev.package.kagaz-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
