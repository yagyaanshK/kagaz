[package]
name = "kagaz-cli"
description = "Kagaz command line: printers and scanners that just work"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "kagaz"
path = "src/main.rs"

[dependencies]
kagaz-core = { path = "../kagaz-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
libc = "0.2.190"
