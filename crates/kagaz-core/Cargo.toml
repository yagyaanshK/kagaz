[package]
name = "kagaz-core"
description = "Core library of Kagaz: device discovery, protocols, driver database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flate2 = "1"
libc = "0.2"
socket2 = "0.6"
getrandom = "0.3"
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
mdns-sd = "0.21"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
hayro = "0.8.0"
sha2 = "0.11.0"
toml = "1.1.6"
hmac = "0.13.0"
# Pairing with a computer that runs Kagaz: the code goes into SPAKE2
# (MIT or Apache-2.0), so nobody listening learns it (remote/link.rs).
spake2 = "0.4"
sha1 = "0.11.0"
md-5 = "0.11.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
# The stand-in Cast TV's own certificate, made when it starts, as a TV
# makes its own (rcgen, MIT or Apache-2.0).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
webpki-roots = "1"
base64 = "0.22"
lzma-rs = "0.3"
tar = "0.4"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# A VNC password's challenge and response.
des = "0.8"
num-bigint = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20 = "0.9"
salsa20 = "0.10"

[dev-dependencies]
# Pictures in the clipboard tests are made and read as PNG.
png = "0.18"

# Computers only. USB printers and scanners (a phone has no such port use).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nusb = "0.2"
# H.264 for screen mirroring to TVs (the same OpenH264 build from source).
openh264 = { version = "0.9", default-features = false, features = ["source"] }
# A Remote Desktop computer's sound through the system's own (on Android,
# rdp/play_android.rs: cpal links AAudio, which Android 7 does not have).
cpal = "0.17"

# Remote Desktop sessions (IronRDP's parts, MIT or Apache-2.0), on
# computers and on Android (2026-11-22, the owner: as Microsoft's Windows
# App does there); not on an iPhone yet.
[target.'cfg(not(target_os = "ios"))'.dependencies]
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-blocking = "0.12"
ironrdp-pdu = "0.11"
ironrdp-graphics = "0.11"
ironrdp-core = "0.3"
ironrdp-dvc = "0.10"
ironrdp-svc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-cliprdr = "0.9"
# Pictures on the clipboard: between PNG and the form Windows keeps them in.
ironrdp-cliprdr-format = "0.3"
# The newer picture (the graphics pipeline): its H.264 pictures are
# decoded by OpenH264 (BSD-2-Clause), built into Kagaz from its source,
# the owner's choice (2026-11-17).
ironrdp-egfx = { version = "0.5", features = ["openh264-bundled"] }
# The computer's sound: the library's channel for it and its decoders of
# the plainer forms. Kagaz's own player (rdp/play.rs) plays it through
# cpal (Apache-2.0) to the system's own sound, from a ring it shares with
# the sound's own thread (ringbuf, MIT or Apache-2.0).
ironrdp-rdpsnd = "0.11"
ringbuf = "0.5"
# Windows starts its sound only for a viewer that also offers the channel
# for redirected devices; Kagaz offers it with no device on it.
ironrdp-rdpdr = "0.9"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
# Reaching a paired computer from another network (remote/far.rs): an
# encrypted connection over UDP (quinn, MIT or Apache-2.0) through a door
# that answers paired devices only.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "sync", "io-util", "macros"] }
socket2 = "0.6"

# Folders of this computer shown to a Remote Desktop computer as drives
# (files sent from here, a shared folder): IronRDP's filesystem backend
# for this system.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
ironrdp-rdpdr-native = "0.9"

[target.'cfg(not(target_os = "android"))'.dependencies]
# Atomberg fans over this computer's Bluetooth LE adapter (Linux through
# BlueZ, Windows WinRT, macOS CoreBluetooth). Async by nature, so a small
# tokio runtime runs each short exchange; the phone's Bluetooth is Kotlin's.
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
    "Win32_System_Power",
] }
# Mirroring to a TV on Windows: the screen through
# Windows.Graphics.Capture, H.264 through Media Foundation (the graphics chip's encoder
# where there is one), and Win+K for Windows' own Cast.
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# A computer's sound packed as Opus is decoded by libopus (BSD-3-Clause),
# built in from its source. That build does not cross to Windows from
# Linux, so Kagaz on Windows takes the sound in its plainer forms.
[target.'cfg(all(not(windows), not(target_os = "ios")))'.dependencies]
opus2 = { version = "0.4", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Mirroring to a TV from a Mac: the screen through ScreenCaptureKit
# (Objective-C, through objc2's bindings, MIT); VideoToolbox, CoreMedia and
# CoreVideo are called through their C functions.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSString"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "SCStream", "SCShareableContent", "objc2-core-media", "block2", "dispatch2"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMSampleBuffer", "CMTime", "CMBase"] }

[target.'cfg(target_os = "linux")'.dependencies]
# NetworkManager's Wi-Fi Direct for TVs on no network (already built for btleplug).
dbus = "0.9"
