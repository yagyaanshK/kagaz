[package]
name = "kagaz-core"
description = "Core library of Kagaz: device discovery, protocols, driver database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flate2 = "1"
libc = "0.2"
socket2 = "0.6"
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
mdns-sd = "0.21"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
hayro = "0.8.0"
sha2 = "0.11.0"
toml = "1.1.6"
hmac = "0.13.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
base64 = "0.22"
lzma-rs = "0.3"
tar = "0.4"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
num-bigint = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20 = "0.9"
salsa20 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
nusb = "0.2"
# Atomberg fans over this computer's Bluetooth LE adapter (Linux through
# BlueZ, Windows WinRT, macOS CoreBluetooth). Async by nature, so a small
# tokio runtime runs each short exchange; the phone's Bluetooth is Kotlin's.
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }
