[package]
name = "kagaz-core"
description = "Core library of Kagaz: device discovery, protocols, driver database"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
flate2 = "1"
libc = "0.2"
socket2 = "0.6"
if-addrs = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
mdns-sd = "0.21"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
hayro = "0.8.0"
sha2 = "0.11.0"
toml = "1.1.6"
hmac = "0.13.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
base64 = "0.22"
lzma-rs = "0.3"
tar = "0.4"
url = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# A VNC password's challenge and response.
des = "0.8"
num-bigint = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20 = "0.9"
salsa20 = "0.10"

[dev-dependencies]
# Pictures in the clipboard tests are made and read as PNG.
png = "0.18"

# USB printers and scanners: computers only (a phone has no such port use).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
nusb = "0.2"
# Remote Desktop sessions (IronRDP's parts, MIT or Apache-2.0), on
# computers for now; the phone's viewer comes with step 2 of
# docs/remote-connection.md.
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-blocking = "0.12"
ironrdp-pdu = "0.11"
ironrdp-graphics = "0.11"
ironrdp-core = "0.3"
ironrdp-dvc = "0.10"
ironrdp-displaycontrol = "0.10"
ironrdp-cliprdr = "0.9"
# Pictures on the clipboard: between PNG and the form Windows keeps them in.
ironrdp-cliprdr-format = "0.3"
# The newer picture (the graphics pipeline): its H.264 pictures are
# decoded by OpenH264 (BSD-2-Clause), built into Kagaz from its source,
# the owner's choice (2026-11-17).
ironrdp-egfx = { version = "0.5", features = ["openh264-bundled"] }
# The computer's sound: the library's channel for it; its player is
# below, by system.
ironrdp-rdpsnd = "0.11"
# Windows starts its sound only for a viewer that also offers the channel
# for redirected devices; Kagaz offers it with no device on it.
ironrdp-rdpdr = "0.9"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Atomberg fans over this computer's Bluetooth LE adapter (Linux through
# BlueZ, Windows WinRT, macOS CoreBluetooth). Async by nature, so a small
# tokio runtime runs each short exchange; the phone's Bluetooth is Kotlin's.
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Storage_Xps",
] }
# The player of a computer's sound, without Opus (see below).
ironrdp-rdpsnd-native = { version = "0.8", default-features = false, features = ["aac"] }

# The player of a computer's sound (through cpal to the system's own
# sound). Opus is decoded by libopus (BSD-3-Clause), built in from its
# source; that build does not cross to Windows from Linux, and Windows
# has a decoder of its own for the AAC it prefers.
[target.'cfg(all(not(windows), not(any(target_os = "android", target_os = "ios"))))'.dependencies]
ironrdp-rdpsnd-native = "0.8"
