<!doctype html>
<html lang="en" data-viewer="on" data-session="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kagaz</title>
  <script src="platform.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skins.css">
</head>
<body>
  <!-- A session's own window (remote_windows.rs opens one for each
       Connect, on a computer): one device's screen under Kagaz's green
       bar, and nothing else of Kagaz. The viewer is the main page's
       (remote-view.js), and so are its tools and its stage below: what
       changes there changes here. session.js starts it. -->
  <div id="column">
    <header id="bar">
      <h1 id="bar-title"></h1>
      <div class="bar-actions">
        <span id="bar-remote" class="bar-remote hidden">
        <span id="rv-chip" class="rc-chip" title="How this session travels"><span id="rv-chip-icon" class="ic" data-icon="lock"></span><span id="rv-chip-path" class="rc-chip-path"></span><span id="rv-chip-text"></span></span>
        <span id="rv-mode" class="rc-mode hidden" role="group" aria-label="Control or watch"><button id="rv-mode-control" type="button" class="on" aria-pressed="true" title="Use its mouse and keys">Control</button><button id="rv-mode-watch" type="button" aria-pressed="false" title="Only watch: this computer's mouse and keys stay here">Watch</button></span>
        <button id="rv-keys" type="button" class="bar-btn" aria-haspopup="true" aria-expanded="false" title="Send keys such as Ctrl + Alt + Del" aria-label="Send keys"><span class="ic" data-icon="keyboard"></span></button>
        <button id="rv-clip" type="button" class="bar-btn" title="Send this computer's clipboard (text or a picture) to the device; what is copied there arrives here by itself" aria-label="Send the clipboard"><span class="ic" data-icon="clipboard"></span></button>
        <button id="rv-file" type="button" class="bar-btn" aria-label="Send a file" disabled><span class="ic" data-icon="file"></span></button>
        <button id="rv-sound" type="button" class="bar-btn" aria-label="The device's sound" disabled><span class="ic" data-icon="speaker"></span></button>
        <button id="rv-screens" type="button" class="bar-btn" aria-label="Choose a monitor" disabled><span class="ic" data-icon="screens"></span></button>
        <button id="rv-picture" type="button" class="bar-btn" aria-haspopup="true" aria-expanded="false" title="Picture: sharper or smoother, and its size" aria-label="Picture"><span class="ic" data-icon="picture"></span></button>
        <button id="rv-full" type="button" class="bar-btn" title="Full screen" aria-label="Full screen"><span class="ic" data-icon="full"></span></button>
        </span>
        <button id="sw-settings" type="button" class="bar-btn" title="Settings for this device and its window" aria-label="Settings" aria-expanded="false" aria-controls="sw-panel"><span class="ic" data-icon="settings"></span></button>
        <button id="sw-main" type="button" class="bar-btn" title="Show Kagaz's main window" aria-label="Show Kagaz's main window"><span class="ic" data-icon="home"></span></button>
      </div>
    </header>
    <main id="main">
      <section id="remote" class="pane">
        <div id="remote-viewer-view" class="rc-viewer">
          <!-- A call at the door, wherever the person is (shell.js in the
               main window says when): over the screen, not beside it, so
               that the device does not redraw its screen for it. -->
          <div id="urgent" class="urgent hidden" role="alert">
            <span class="urgent-icon ic" data-icon="bell"></span>
            <span class="urgent-text"><strong id="urgent-title"></strong><span id="urgent-sub"></span></span>
            <span class="urgent-actions">
              <button id="urgent-answer" type="button" class="urgent-btn primary">Answer</button>
              <button id="urgent-decline" type="button" class="urgent-btn">Decline</button>
            </span>
          </div>
        <div id="rv-banner" class="rc-banner hidden" role="status"><span class="ic" data-icon="unlock"></span><span><strong>Not encrypted on this network.</strong> Others on it can read the screen and what you type; over Tailscale they can't.</span></div>
        <div id="rv-stage" class="rc-stage" tabindex="0" aria-label="The device's screen. Keys typed here go to the device.">
        <canvas id="rv-canvas" class="rc-screen hidden"></canvas>
        <div id="rv-card" class="rc-card hidden"></div>
        <div id="rv-pop" class="rc-pop hidden"></div>
        <p id="rv-toast" class="rc-toast hidden" role="status"></p>
        </div>
        <!-- Settings behind the gear, over the screen's right side (not
             beside it, so that the device does not redraw its screen). -->
        <aside id="sw-panel" class="sw-panel hidden" aria-label="Settings">
          <div class="sw-panel-head">
            <h2>Settings</h2>
            <button id="sw-panel-close" type="button" class="icon" title="Close settings" aria-label="Close settings"><span class="ic" data-icon="close"></span></button>
          </div>
          <div id="sw-panel-body" class="sw-panel-body"></div>
        </aside>
        <!-- A narrow window has no room in the bar: the tools sit here. -->
        <div id="rv-touchbar" class="rc-touchbar">
        <button type="button" data-tool="rv-keys"><span class="ic" data-icon="keyboard"></span><span>Keys</span></button>
        <button type="button" data-tool="rv-clip"><span class="ic" data-icon="clipboard"></span><span>Paste</span></button>
        <button type="button" data-tool="rv-picture"><span class="ic" data-icon="picture"></span><span>Picture</span></button>
        <button type="button" data-tool="rv-full"><span class="ic" data-icon="full"></span><span>Full screen</span></button>
        </div>
        </div>
      </section>
    </main>
  </div>

  <script src="session-base.js"></script>
  <script src="icons.js"></script>
  <script src="nav.js"></script>
  <script src="ask.js"></script>
  <script src="reveal.js"></script>
  <!-- The H.264 helpers the viewer decodes a device's pictures with. -->
  <script src="player.js"></script>
  <script src="remote-view.js"></script>
  <script src="remote-settings.js"></script>
  <script src="session.js"></script>
</body>
</html>
