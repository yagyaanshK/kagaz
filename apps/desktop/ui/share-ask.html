<!doctype html>
<html lang="en" data-pop="ask">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kagaz</title>
  <script src="platform.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="skins.css">
</head>
<body class="share-pop">
  <!-- A paired device asks to connect to this computer (share.rs opens
       this window on top of everything). -->
  <form id="ask" class="share-ask">
    <h1 class="share-ask-title"><span class="ic" data-icon="guard"></span><span id="ask-who">A device wants to connect</span></h1>
    <div class="ask-choices">
      <label class="ask-choice switch wrap"><input type="radio" name="how" value="control" checked><span>Watch and use the mouse and keys</span></label>
      <label class="ask-choice switch wrap"><input type="radio" name="how" value="watch"><span>Watch only</span></label>
    </div>
    <div class="actions">
      <button id="ask-no" type="button">Don't allow</button>
      <button id="ask-yes" type="submit" class="accent">Allow</button>
    </div>
    <p id="ask-left" class="muted small" role="status"></p>
  </form>
  <script src="icons.js"></script>
  <script src="share-pop.js"></script>
</body>
</html>
