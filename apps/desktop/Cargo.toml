[package]
name = "kagaz-desktop"
description = "Kagaz desktop app: a small window over the core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# Android loads the app as a shared library (cdylib), iOS as a static one.
name = "kagaz_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kagaz-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kagaz-core = { path = "../../crates/kagaz-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The window's WebKitGTK, to let the page use the microphone for calls.
webkit2gtk = "2.0.2"
