# Builds the Windows installers and the Android app. Runs by hand (Actions
# tab, "Run workflow") and for version tags; the files land as artifacts
# of the run.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.12.2"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked
      - name: Command-line tool
        run: cargo build --release -p kagaz-cli
      - name: Window app and installers (MSI, NSIS)
        working-directory: apps/desktop
        run: cargo tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: kagaz-windows
          path: |
            target/release/kagaz.exe
            target/release/kagaz-desktop.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Tauri CLI
        run: cargo install tauri-cli --version "${{ env.TAURI_CLI_VERSION }}" --locked
      # A debug build is signed with a throwaway key, so it installs on a
      # phone as it is. A store release needs a signing key of its own.
      - name: APK
        working-directory: apps/desktop
        run: cargo tauri android build --debug --apk --ci
      - uses: actions/upload-artifact@v4
        with:
          name: kagaz-android
          path: apps/desktop/gen/android/app/build/outputs/apk/universal/debug/*.apk
